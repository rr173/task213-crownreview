<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城市树冠断枝复核台</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --fg:#e2e8f0; --accent:#f97316; --ok:#22c55e; --warn:#facc15; --rej:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .muted { color:#94a3b8; font-size:12px; }
  main { display:flex; height: calc(100vh - 57px); }
  #canvas-wrap { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; }
  aside { width:340px; border-left:1px solid var(--line); padding:16px; overflow-y:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:#cbd5e1; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; }
  .t-open { background:#1d4ed8; color:#dbeafe; }
  .t-confirmed { background:#14532d; color:#bbf7d0; }
  .t-rejected { background:#7f1d1d; color:#fecaca; }
  .t-merged { background:#713f12; color:#fde68a; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
  button.secondary { background:#334155; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:8px 0; border-bottom:1px solid var(--line); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>城市树冠激光点云断枝复核台</h1>
  <span class="muted">批次 <span id="batch-id">-</span> · <span id="batch-status">-</span></span>
  <span class="muted" id="stats"></span>
</header>
<main>
  <div id="canvas-wrap"><canvas id="view"></canvas></div>
  <aside>
    <div class="card">
      <h3>断枝候选</h3>
      <ul id="candidates"></ul>
    </div>
    <div class="card">
      <h3>遮挡不确定区</h3>
      <ul id="occlusion"></ul>
    </div>
    <div class="card">
      <h3>巡检版本</h3>
      <ul id="versions"></ul>
      <button id="btn-new-version" class="secondary">新建版本</button>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const api = async (p, o) => { const r = await fetch('/api'+p, o ? {method:o.method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(o.body)} : undefined); if(!r.ok) throw new Error(await r.text()); return r.json(); };

let points = [], candidates = [], occlusion = [], batchId = null, versionId = null;

function project(p, rotY) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  const x = p[0]*cy - p[2]*sy, z = p[0]*sy + p[2]*cy;
  return { x, y: p[1], z };
}

async function refresh() {
  try {
    const batches = await api('/batches');
    if (batches.length) { batchId = batches[batches.length-1].id; $('batch-id').textContent = batchId; $('batch-status').textContent = batches[batches.length-1].status; }
    const blocks = batchId ? await api('/blocks?batch_id='+batchId) : await api('/blocks');
    if (blocks.length) {
      const blk = blocks[blocks.length-1];
      const pts = await api('/blocks/'+blk.id+'/skeleton');
      const edges = await api('/blocks/'+blk.id+'/skeleton');
      points = edges.flatMap(e => [e.from_point, e.to_point]);
      const occ = await api('/blocks/'+blk.id+'/occlusion');
      occlusion = occ.map(z => ({center:z.center, radius:z.radius, score:z.score}));
    }
    const cs = batchId ? await api('/candidates?block_id=' + (blocks.length ? blocks[blocks.length-1].id : 0)) : await api('/candidates');
    candidates = cs;
    renderCandidates();
    if (batchId) renderVersions();
    const st = await api('/stats'); $('stats').textContent = 'candidates:'+st.candidates+' confirmed:'+st.confirmed;
  } catch(e) { console.error(e); }
}

function renderCandidates() {
  $('candidates').innerHTML = '';
  candidates.forEach(c => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="tag t-'+c.status+'">'+c.status+'</span> '+
      'conf '+c.confidence.toFixed(2)+' · pos '+c.position.map(v=>v.toFixed(2)).join(',') +
      '<div style="margin-top:4px">' +
      '<button onclick="act('+c.id+',\'confirm\')">确认</button> ' +
      '<button class="secondary" onclick="act('+c.id+',\'reject\')">否决</button></div>';
    $('candidates').appendChild(li);
  });
}

async function act(id, op) {
  try { await api('/candidates/'+id+'/'+op, {method:'POST', body:{}}); await refresh(); }
  catch(e){ alert(e.message); }
}

async function renderVersions() {
  $('versions').innerHTML = '';
  if (!batchId) return;
  const vs = await api('/batches/'+batchId+'/versions');
  vs.forEach(v => {
    const li = document.createElement('li');
    li.innerHTML = v.label + ' · <span class="tag">'+v.status+'</span>' +
      (v.status==='draft' ? ' <button class="secondary" onclick="freeze('+v.id+')">冻结</button>' : '');
    $('versions').appendChild(li);
  });
  if (vs.length) versionId = vs[vs.length-1].id;
}

async function freeze(id) { try { await api('/versions/'+id+'/freeze', {method:'POST', body:{}}); await refresh(); } catch(e){ alert(e.message); } }
async function newVersion() { try { await api('/batches/'+batchId+'/versions', {method:'POST', body:{}}); await refresh(); } catch(e){ alert(e.message); } }

let rotY = 0;
function draw() {
  const cv = $('view'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; ctx.scale(dpr,dpr);
  ctx.fillStyle = '#0b1120'; ctx.fillRect(0,0,w,h);
  if (!points.length) { ctx.fillStyle='#94a3b8'; ctx.font='13px sans-serif'; ctx.fillText('暂无数据', 20, 30); return; }
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]), zs = points.map(p=>p[2]);
  const mx = (Math.min(...xs)+Math.max(...xs))/2, my = (Math.min(...ys)+Math.max(...ys))/2, mz = (Math.min(...zs)+Math.max(...zs))/2;
  const scale = Math.min(w,h) / Math.max(1, Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)));
  const cx = w/2, cy2 = h/2;
  ctx.fillStyle = '#38bdf8';
  for (const p of points) {
    const q = project([p[0]-mx, p[1]-my, p[2]-mz], rotY);
    const sx = cx + q.x*scale, sy = cy2 - q.y*scale + q.z*scale*0.3;
    ctx.fillRect(sx, sy, 2, 2);
  }
  occlusion.forEach(z => {
    const q = project([z.center[0]-mx, z.center[1]-my, z.center[2]-mz], rotY);
    const sx = cx + q.x*scale, sy = cy2 - q.y*scale + q.z*scale*0.3;
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(3, z.radius*scale), 0, Math.PI*2); ctx.strokeStyle='#facc15'; ctx.stroke();
  });
  candidates.forEach(c => {
    if (c.status === 'rejected') return;
    const q = project([c.position[0]-mx, c.position[1]-my, c.position[2]-mz], rotY);
    const sx = cx + q.x*scale, sy = cy2 - q.y*scale + q.z*scale*0.3;
    ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI*2);
    ctx.fillStyle = c.status==='confirmed' ? '#22c55e' : '#f97316'; ctx.fill();
  });
}

let dragging = false, lastX = 0;
$('view').addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => { if (dragging) { rotY += (e.clientX - lastX)*0.01; lastX = e.clientX; draw(); } });

$('btn-new-version').addEventListener('click', newVersion);
window.addEventListener('resize', draw);
refresh().then(draw);
</script>
</body>
</html>
